// Common Java + library setup shared by every module.
plugins {
    id 'java-library'
}

java {
    // Toolchain intentionally NOT pinned: the build image (gradle:9.7.0-jdk25-ubi)
    // runs on JDK 25, and javac --release (set below) targets the required level.
    // Pinning a toolchain forces a Foojay download that is incompatible with
    // Gradle 9.7 in this environment.
}

repositories {
    mavenCentral()
}

dependencies {
    // Lombok is broadly useful for value objects / aggregates. Version comes
    // from the catalog (works standalone, i.e. without a Spring Boot BOM).
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
}

// Align the whole JUnit stack to 6.0.3. A transitive junit-bom:5.11.3 (from
// testcontainers/awaitility) constrains junit-platform-launcher to 1.11.3,
// which mismatches the SB-BOM-managed junit-jupiter-engine 6.0.3 and breaks
// Gradle 9 test discovery. resolutionStrategy.force() loses to that BOM
// `strictly` constraint, so we use eachDependency (the highest-priority rule,
// applied last) to pin every org.junit module to 6.1.3.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.junit.jupiter' || details.requested.group == 'org.junit.platform') {
            details.useVersion('6.1.3')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
    // Tests run in CI containers where Docker may be available for Testcontainers.
    systemProperty 'user.language', 'en'
}
