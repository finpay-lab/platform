// Common Java + library setup shared by every module.
plugins {
    id 'java-library'
}

java {
    // Toolchain intentionally NOT pinned: the build image (gradle:9.7.0-jdk25-ubi)
    // runs on JDK 25, and javac --release (set below) targets the required level.
    // Pinning a toolchain forces a Foojay download that is incompatible with
    // Gradle 9.7 in this environment.
}

repositories {
    mavenCentral()
}

dependencies {
    // Lombok is broadly useful for value objects / aggregates. Version comes
    // from the catalog (works standalone, i.e. without a Spring Boot BOM).
    compileOnly libs.lombok
    annotationProcessor libs.lombok
    testCompileOnly libs.lombok
    testAnnotationProcessor libs.lombok
}

// Pin the JUnit stack to one consistent version. Transitive test deps
// (archunit 1.3.0, mockito-junit-jupiter) pull a junit-bom that resolves the
// whole stack to JUnit 6.0.3; align everything to 6.0.3 so the launcher and
// engine match (Gradle 9 fails test discovery on a mismatch).
configurations.configureEach {
    resolutionStrategy {
        force(
            'org.junit.jupiter:junit-jupiter:6.0.3',
            'org.junit.jupiter:junit-jupiter-api:6.0.3',
            'org.junit.jupiter:junit-jupiter-engine:6.0.3',
            'org.junit.jupiter:junit-jupiter-params:6.0.3',
            'org.junit.platform:junit-platform-commons:6.0.3',
            'org.junit.platform:junit-platform-engine:6.0.3',
            'org.junit.platform:junit-platform-launcher:6.0.3'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
    // Tests run in CI containers where Docker may be available for Testcontainers.
    systemProperty 'user.language', 'en'
}
