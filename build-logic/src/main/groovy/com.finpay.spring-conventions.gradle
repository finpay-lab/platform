// Spring Boot application module (services). Applies java-library so `api()`
// configuration is available for shared libraries. Reuses java-conventions for
// the shared compile/release setup.
plugins {
    id 'com.finpay.java-conventions'
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

java {
    // No toolchain pin — see com.finpay.java-conventions (uses running JDK 21 +
    // javac --release to target Java 21).
}

// Align the whole JUnit stack to 6.1.3. Spring Boot's spring-boot-dependencies
// BOM pins junit-platform-launcher to 1.11.3, which mismatches the jupiter
// engine 6.x and breaks Gradle 9 test discovery. eachDependency is the
// highest-priority resolution rule and overrides that BOM constraint.
configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.junit.jupiter' || requested.group == 'org.junit.platform') {
            useVersion('6.1.3')
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor libs.lombok
    testAnnotationProcessor libs.lombok
}

// Override versions that the Spring Boot dependency-management BOM pins to
// older releases, which otherwise break alignment under Gradle 9:
//  - junit-platform-launcher must match junit-jupiter-engine (both 6.0.3); a
//    transitive junit-bom:5.11.3 (from testcontainers/awaitility) constrains
//    launcher to 1.11.3, causing "OutputDirectoryCreator not available" at
//    test discovery. Importing the junit 6 BOM overrides that constraint.
dependencyManagement {
    imports {
        mavenBom 'org.junit:junit-bom:6.0.3'
    }
    dependencies {
        dependency 'org.junit.jupiter:junit-jupiter:6.0.3'
        dependency 'org.junit.jupiter:junit-jupiter-api:6.0.3'
        dependency 'org.junit.jupiter:junit-jupiter-engine:6.0.3'
        dependency 'org.junit.jupiter:junit-jupiter-params:6.0.3'
        dependency 'org.junit.platform:junit-platform-commons:6.0.3'
        dependency 'org.junit.platform:junit-platform-engine:6.0.3'
        dependency 'org.junit.platform:junit-platform-launcher:6.0.3'
        dependency 'org.testcontainers:testcontainers:1.21.1'
        dependency 'org.testcontainers:junit-jupiter:1.21.1'
        dependency 'org.testcontainers:postgresql:1.21.1'
    }
}

// Libraries are not packaged as bootable jars. Services override this.
bootJar {
    enabled = false
}
jar {
    enabled = true
}
