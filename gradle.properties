org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache disabled: maven-publish's generatePom task is not
# config-cache compatible in Gradle 8.10, and these libs publish to GitHub
# Packages. Re-enable once on Gradle 8.12+ if desired.
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
springBootVersion=3.3.5

# GitHub Packages publish credentials are NEVER committed. Supply at build time:
#   gradle publish -Pgpr.user=$ACTOR -Pgpr.token=$TOKEN
# where $TOKEN comes from `gh auth token`. Falls back to GITHUB_ACTOR /
# GITHUB_TOKEN env vars if -P not given.
